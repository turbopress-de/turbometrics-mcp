services:
  mcp:
    image: wpperf-mcp
    # Ohne diesen Block war 'docker compose up -d --build' ein stiller
    # Leerlauf: ohne build-Kontext gibt es nichts zu bauen, compose nahm das
    # vorhandene Image und meldete "Container Running". Am 2026-08-24 blieb so
    # eine ausgerollte Aenderung unbemerkt liegen — das Flag sah aus, als
    # haette es gewirkt.
    build:
      context: .
    container_name: wpperf-mcp
    restart: unless-stopped
    init: true
    ports:
      # Nur an localhost binden — erreichbar ausschliesslich ueber den nginx-Proxy
      # unter /mcp. Ohne diese Bindung haengt der Server am oeffentlichen Interface
      # und ist an Cloudflare, TLS und Rate Limit vorbei ansprechbar.
      - "127.0.0.1:3001:3001"
    env_file:
      - ./.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  default:
    enable_ipv6: true
